# Netlify config. If you deploy somewhere else, this file is ignored
# and everything still works — it's a static site.

[build]
  publish = "."
  # No build command. There is no build. That's the point.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # No third-party anything. If you later add fonts or maps, loosen this.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'"

# Artwork, photos and the video never change once published, so cache them hard.
[[headers]]
  for = "/assets/art/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The stylesheet and scripts DO change. Caching these as immutable would mean a
# returning guest kept the old site for a year, so they revalidate every time.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    # Config and posts change often — never let them go stale.
    Cache-Control = "public, max-age=0, must-revalidate"

# The two missions used to be separate pages. Anyone who kept a link lands
# on the right place instead of the 404.
[[redirects]]
  from = "/photos.html"
  to = "/missions.html"
  status = 301

[[redirects]]
  from = "/quiz.html"
  to = "/missions.html"
  status = 301
