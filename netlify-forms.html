<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form definitions</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<!-- ============================================================
     NETLIFY FORM DEFINITIONS — nothing links here, nobody sees
     this page, do not delete it.

     Netlify works out a form's fields by reading the HTML it is
     given at deploy time. The quiz and the photo mission on
     missions.html are both drawn by JavaScript out of
     data/config.js, so Netlify would see two empty forms and
     throw every answer away.

     These two copies declare the field names instead. They live
     on their own page so the names don't collide with the real
     forms in missions.html. Netlify reads every HTML file in the
     deploy, so this is enough.

     If you change the NUMBER of prompts or questions in
     config.js, add or remove lines here to match:
       shot_01, shot_02 …   one per photograph
       q0, q1 …             one per question, counting from zero
     ============================================================ -->

<form name="photos" data-netlify="true" netlify-honeypot="bot-field" hidden
      enctype="multipart/form-data">
  <input type="hidden" name="form-name" value="photos">
  <input name="bot-field">
  <input name="guest_name"><input name="email"><textarea name="message"></textarea>
      <input type="file" name="shot_01">
      <input type="file" name="shot_02">
      <input type="file" name="shot_03">
      <input type="file" name="shot_04">
      <input type="file" name="shot_05">
      <input type="file" name="shot_06">
      <input type="file" name="shot_07">
      <input type="file" name="shot_08">
      <input type="file" name="shot_09">
      <input type="file" name="shot_10">
</form>

<form name="quiz" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quiz">
  <input name="bot-field">
  <input name="guest_name"><input name="email"><input name="score">
      <input type="radio" name="q0" value="0">
      <input type="radio" name="q1" value="0">
      <input type="radio" name="q2" value="0">
      <input type="radio" name="q3" value="0">
      <input type="radio" name="q4" value="0">
      <input type="radio" name="q5" value="0">
      <input type="radio" name="q6" value="0">
      <input type="radio" name="q7" value="0">
      <input type="radio" name="q8" value="0">
      <input type="radio" name="q9" value="0">
</form>

</body>
</html>
